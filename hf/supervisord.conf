[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:postgres]
command=postgres -D /home/user/pgdata -c listen_addresses=127.0.0.1 -c unix_socket_directories=/tmp
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
directory=/home/user/app/backend
command=uvicorn app.main:app --host 127.0.0.1 --port 8000
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
directory=/home/user/app/backend
command=celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 -B -s /tmp/celerybeat-schedule
priority=6
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:frontend]
directory=/home/user/app/frontend
command=node node_modules/next/dist/bin/next start -p 3000
environment=NODE_ENV="production"
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -e /dev/stderr -c /home/user/app/hf/nginx.conf -g "daemon off;"
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
